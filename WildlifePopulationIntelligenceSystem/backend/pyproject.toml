[project]
name = "wildlife-population-intelligence-system-backend"
version = "0.1.0"
description = "Backend for Wildlife Population Intelligence System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0", "psycopg[binary]>=3.2,<4.0", "pydantic-settings>=2.5,<3.0",
  "python-jose[cryptography]>=3.3,<4.0", "passlib[bcrypt]>=1.7,<2.0", "python-multipart>=0.0.9,<1.0", "email-validator>=2.0,<3.0",
  "ultralytics>=8.3", "Pillow>=10.0", "tensorflow>=2.16", "librosa>=0.10", "scikit-learn>=1.4", "soundfile>=0.12", "matplotlib>=3.8"
]
[tool.ruff]
line-length = 100
target-version = "py311"
