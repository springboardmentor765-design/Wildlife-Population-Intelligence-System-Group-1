services:
  api:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/ml_models:/app/ml_models
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/wildlife.db

  web:
    build: ./frontend
    working_dir: /web
    volumes:
      - ./frontend:/web
      - /web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true
