version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wildlife_user
      POSTGRES_PASSWORD: wildlife_password
      POSTGRES_DB: wildlife_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend/wildlife-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/wildlife-backend/results:/app/results
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://wildlife_user:wildlife_password@db:5432/wildlife_db
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/wildlife-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
